[package]
name = "ak-configurator"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Native configurator for supported AK820 firmware, based on Entropy"
authors = ["Ergohaven"]
license = "GPL-3.0-or-later"
repository = "https://github.com/dvino/ak-configurator"
homepage = "https://github.com/dvino/ak-configurator"
readme = "README.md"
keywords = ["keyboard", "vial", "qmk", "rmk", "hid"]
categories = ["gui", "hardware-support"]
build = "build.rs"
include = [
    "Cargo.lock",
    "Cargo.toml",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "assets/**",
    "build.rs",
    "i18n/**",
    "linux/**",
    "src/**",
]

[[bin]]
name = "ak-configurator"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[features]
default = []
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]
# Development-only synthetic backend; never enabled in release packages.
mcp-mock = ["mcp"]

[dependencies]
eframe = { version = "0.34.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "web_screen_reader", "x11"] }
egui = "0.34.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
emojis = "0.9"
twemoji-assets = { version = "=1.5.1", default-features = false, features = ["png"] }
unicode-segmentation = "1.13"
log = "0.4"
env_logger = "0.11"
flate2 = "1"
dirs = "5"
lzma-rs = "0.3"
anyhow = "1"
chrono = "0.4"
base64 = "0.21"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
postcard = "1"
rmk-types = { git = "https://github.com/ergohaven/rmk.git", rev = "99cdcd542600eb1a439675455997fe7cf3928600", default-features = false }
semver = "1"
url = "2"
rmcp = { version = "=3.8.0", optional = true, default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", optional = true, features = ["rt", "io-std", "time", "sync", "macros"] }
schemars = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
# Preserve eframe's native winit defaults while selecting its Glow renderer.
winit = "0.30.13"
raw-window-handle = "0.6"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "linux"), not(target_os = "macos")))'.dependencies]
hidapi = "2.6"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.22"
windows-sys = { version = "0.60", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Devices_HumanInterfaceDevice", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Foundation", "Win32_Globalization", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.56", features = ["Foundation", "Foundation_Collections", "Media_Control", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Vial shares a Bluetooth HID service with the keyboard reports. Shared mode
# prevents hidapi from trying to seize the whole keyboard, which macOS rejects.
hidapi = { version = "2.6", features = ["macos-shared-device"] }
dispatch2 = "0.3.1"
objc = "0.2"
tray-icon = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "2"
dbus = { version = "0.9", features = ["vendored"] }
futures-lite = "2"
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
kdotool = { version = "0.3", default-features = false }
x11-dl = "2"
zbus = "5.16"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
getrandom = { version = "0.2", features = ["js"] }

[patch.crates-io]
eframe = { path = "vendor/eframe" }

[profile.release]
opt-level = 3
lto = true
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dev-dependencies]
egui_kittest = { version = "0.34", default-features = false }
