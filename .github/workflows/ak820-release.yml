name: AK Configurator desktop candidate preparation

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to validate and package (no release publication)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ak820-candidate-${{ github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate candidate tag and source version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Require exact v-prefixed Cargo version tag
        id: identity
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$REQUESTED_TAG" = "v$version" || { echo "Tag $REQUESTED_TAG must exactly equal v$version" >&2; exit 1; }
          git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}" >/dev/null
          tag_commit="$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          test "$head_commit" = "$tag_commit" || { echo "Checkout HEAD does not match resolved tag commit" >&2; exit 1; }
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Run offline verifier tests
        run: python3 scripts/test_ak820_release_workflow.py

  build:
    name: Build and test all six targets
    needs: validate
    uses: ./.github/workflows/desktop-dev.yml
    with:
      candidate_ref: ${{ needs.validate.outputs.commit }}
    permissions:
      contents: read

  verify:
    name: Verify and retain all candidate packages
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-candidate-*
          path: candidate-artifacts
          merge-multiple: true
      - name: Verify all six packages and provenance
        env:
          CANDIDATE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          python3 scripts/verify_ak820_release_candidate.py \
            --directory candidate-artifacts \
            --version "$CANDIDATE_VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --manifest release-manifest.json \
            --update-index app-update-index.json
      - name: Retain verified candidate packages (no release publication)
        uses: actions/upload-artifact@v7
        with:
          name: ak-configurator-release-candidate-${{ needs.validate.outputs.version }}
          path: |
            candidate-artifacts/*.zip
            candidate-artifacts/*.tar.gz
            candidate-artifacts/*.sha256
            candidate-artifacts/install-smoke-*.json
            release-manifest.json
            app-update-index.json
          if-no-files-found: error
          retention-days: 30
