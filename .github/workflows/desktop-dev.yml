name: Desktop development builds

on:
  workflow_call:
    inputs:
      candidate_ref:
        description: Git ref to build and package
        required: true
        type: string
    secrets:
      AK_WINDOWS_CODE_SIGN_PFX_BASE64:
        required: true
      AK_WINDOWS_CODE_SIGN_PFX_PASSWORD:
        required: true
  workflow_dispatch:
  push:
    branches: [desktop-dev, desktop, 'handoff/c02-windows', 'codex/**']
  pull_request:
    branches: [desktop-dev, desktop]

permissions:
  contents: read

concurrency:
  group: desktop-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows_signing_preflight:
    name: Windows signing preflight (${{ matrix.arch }})
    if: ${{ github.repository == 'dvino/ak-configurator' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-vs2026-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Import temporary identity and verify CMS signing
        env:
          AK_WINDOWS_CODE_SIGN_PFX_BASE64: ${{ secrets.AK_WINDOWS_CODE_SIGN_PFX_BASE64 }}
          AK_WINDOWS_CODE_SIGN_PFX_PASSWORD: ${{ secrets.AK_WINDOWS_CODE_SIGN_PFX_PASSWORD }}
          AK_WINDOWS_CODE_SIGN_THUMBPRINT: ${{ vars.AK_WINDOWS_CODE_SIGN_THUMBPRINT }}
          AK_WINDOWS_CODE_SIGN_MODE: ${{ vars.AK_WINDOWS_CODE_SIGN_MODE }}
        run: python scripts/windows_signing_ci.py --public-cert assets/windows/ak-configurator-development.cer -- python scripts/test_windows_signing_preflight.py

  build:
    name: Build (${{ matrix.platform }})
    needs: windows_signing_preflight
    if: ${{ !cancelled() && (needs.windows_signing_preflight.result == 'success' || (needs.windows_signing_preflight.result == 'skipped' && !(github.repository == 'dvino/ak-configurator' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            artifact: development-binary-linux-x86_64
            binary: target/release/ak-configurator
            checksum: target/release/SHA256SUMS
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            artifact: development-binary-linux-arm64
            binary: target/release/ak-configurator
            checksum: target/release/SHA256SUMS
          - os: windows-latest
            platform: windows-x86_64
            artifact: development-binary-windows-x86_64
            binary: target/release/ak-configurator.exe
            checksum: target/release/SHA256SUMS
          - os: windows-11-vs2026-arm
            platform: windows-arm64
            artifact: development-binary-windows-arm64
            binary: target/release/ak-configurator.exe
            checksum: target/release/SHA256SUMS
          - os: macos-15
            platform: macos-arm64
            artifact: development-binary-macos-arm64
            binary: target/aarch64-apple-darwin/release/ak-configurator
            checksum: target/aarch64-apple-darwin/release/SHA256SUMS
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos-x86_64
            artifact: development-binary-macos-x86_64
            binary: target/x86_64-apple-darwin/release/ak-configurator
            checksum: target/x86_64-apple-darwin/release/SHA256SUMS
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}

      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Test audio dependency setup (offline)
        shell: bash
        run: python scripts/test_build_cava_helper.py

      - name: Test Windows installer CI guards (offline)
        if: startsWith(matrix.platform, 'windows-')
        run: python scripts/test_windows_installer_ci.py

      - name: Install macOS Rust target
        if: startsWith(matrix.os, 'macos-')
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libpulse-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libgl1-mesa-dev \
            xvfb \
            dbus-x11 \
            zenity

      - name: Check out pinned Windows audio build tools
        if: startsWith(matrix.platform, 'windows-')
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: 64810c6bf2bdc91ebcd75f140aec77580113f219
          path: target/vcpkg
          persist-credentials: false

      - name: Bootstrap pinned Windows static audio dependencies
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          Import-Module (Join-Path $PSHOME 'Modules/Microsoft.PowerShell.Utility/Microsoft.PowerShell.Utility.psd1') -Force -ErrorAction Stop
          & "$env:GITHUB_WORKSPACE/target/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE/target/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare pinned native Windows pkgconf
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          Import-Module (Join-Path $PSHOME 'Modules/Microsoft.PowerShell.Utility/Microsoft.PowerShell.Utility.psd1') -Force -ErrorAction Stop
          $pkgconf = python scripts/build_cava_helper.py --prepare-windows-pkgconf target/pkgconf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PKG_CONFIG=$pkgconf" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build bundled audio helper without capture
        shell: bash
        run: python scripts/build_cava_helper.py --output-dir target/audio-helper

      - name: Verify real helper using synthetic FIFO PCM
        if: startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'macos-')
        shell: bash
        run: python scripts/test_cava_helper.py --binary target/audio-helper/cava

      - name: Guard Windows static CRT configuration
        if: startsWith(matrix.platform, 'windows-')
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          for name in os.environ:
              if (name in ('RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS', 'CARGO_BUILD_RUSTFLAGS')
                      or (name.startswith('CARGO_TARGET_') and name.endswith('_RUSTFLAGS'))):
                  raise SystemExit(f'{name} overrides Cargo config rustflags')
          with open('.cargo/config.toml', 'rb') as config:
              flags = tomllib.load(config)['target']['cfg(all(windows, target_env = "msvc"))']['rustflags']
          if flags != ['-C', 'target-feature=+crt-static']:
              raise SystemExit('Windows MSVC static CRT configuration is missing or changed')
          PY

      - name: Test Windows installer registry guard
        if: startsWith(matrix.platform, 'windows-')
        run: python scripts/test_windows_installer_registry.py

      - name: Test all targets (Linux and Windows)
        if: startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'windows-')
        run: cargo test --locked --all-targets -- --test-threads=1

      - name: Test AK820 filesystem and ownership (macOS)
        if: startsWith(matrix.platform, 'macos-')
        run: cargo test --locked --bin ak-configurator ak820_backup_files -- --test-threads=1

      - name: Test AK820 device ownership (macOS)
        if: startsWith(matrix.platform, 'macos-')
        run: cargo test --locked --bin ak-configurator 'hid_ownership::' -- --test-threads=1

      - name: Test macOS USB metadata validation
        if: startsWith(matrix.platform, 'macos-')
        run: cargo test --locked --bin ak-configurator macos_usb -- --test-threads=1

      - name: Build development binary (Linux and Windows)
        if: startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'windows-')
        run: cargo build --locked --release --features mcp

      - name: Build development binary (macOS)
        if: matrix.platform == 'macos-arm64' || matrix.platform == 'macos-x86_64'
        run: cargo build --locked --release --features mcp --target ${{ matrix.target }}

      - name: Test optional MCP contracts (Linux and Windows)
        if: startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'windows-')
        run: cargo test --locked --features mcp-mock --bin ak-configurator 'mcp::' -- --test-threads=1

      - name: Build optional MCP mock binary (Linux and Windows)
        if: startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'windows-')
        run: cargo build --locked --bin ak-configurator --features mcp-mock

      - name: Exercise MCP stdio with mock backend (Linux and Windows)
        if: startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'windows-')
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary=target/debug/ak-configurator.exe; else binary=target/debug/ak-configurator; fi
          python scripts/test_mcp_stdio.py --binary "$binary"

      - name: Execute native GUI runtime smoke under Xvfb (Linux)
        id: runtime_smoke_linux
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          mkdir -p target/candidate
          dbus-run-session -- xvfb-run -a env AK820_RUNTIME_SMOKE_TRAY_FIXTURE=1 python scripts/test_ak820_runtime_smoke.py --binary "${{ matrix.binary }}" --report "target/candidate/runtime-smoke-${{ matrix.platform }}.json"

      - name: Execute native GUI runtime smoke (Windows)
        id: runtime_smoke_windows
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/candidate | Out-Null
          python scripts/run_windows_ci_runtime_smoke.py --binary "${{ matrix.binary }}" --report "target/candidate/runtime-smoke-${{ matrix.platform }}.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute native GUI runtime smoke (macOS)
        id: runtime_smoke_macos
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          mkdir -p target/candidate
          python scripts/test_ak820_runtime_smoke.py --binary "${{ matrix.binary }}" --report "target/candidate/runtime-smoke-${{ matrix.platform }}.json"

      # Failure reports contain the bounded harness error/stderr and executable
      # identity. Preserve them separately; candidate uploads still require success.
      - name: Retain failed native GUI runtime smoke diagnostics
        if: always() && (steps.runtime_smoke_linux.outcome == 'failure' || steps.runtime_smoke_windows.outcome == 'failure' || steps.runtime_smoke_macos.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: runtime-smoke-failure-${{ matrix.platform }}
          path: target/candidate/runtime-smoke-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Write SHA-256 manifest (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          cd "$(dirname "$BINARY")"
          shasum -a 256 "$(basename "$BINARY")" > SHA256SUMS

      - name: Write SHA-256 manifest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          Import-Module (Join-Path $PSHOME 'Modules/Microsoft.PowerShell.Utility/Microsoft.PowerShell.Utility.psd1') -Force -ErrorAction Stop
          $hash = (Get-FileHash $env:BINARY -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $env:BINARY -Leaf)" | Set-Content -Encoding ascii (Join-Path (Split-Path $env:BINARY) 'SHA256SUMS')

      - name: Execute target runtime self-check (offline, no device access)
        shell: bash
        env:
          CANDIDATE_BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p target/candidate
          "$CANDIDATE_BINARY" --self-check --output target/candidate/runtime-self-check.json

      - name: Package unsigned desktop alpha candidate
        if: runner.os != 'Windows'
        shell: bash
        env:
          CANDIDATE_BINARY: ${{ matrix.binary }}
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
        run: python scripts/package_ak820_candidate.py --binary "$CANDIDATE_BINARY" --platform "$CANDIDATE_PLATFORM" --output-dir target/candidate --runtime-check target/candidate/runtime-self-check.json --cava-helper "target/audio-helper/cava$([[ "$CANDIDATE_PLATFORM" == windows-* ]] && echo .exe || true)"

      - name: Bootstrap pinned Inno Setup and locate Windows SDK SignTool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Module (Join-Path $PSHOME 'Modules/Microsoft.PowerShell.Utility/Microsoft.PowerShell.Utility.psd1') -Force -ErrorAction Stop
          $inno = python scripts/bootstrap_inno_setup.py --destination "$env:RUNNER_TEMP/ak-inno-7.1.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = ($inno | ConvertFrom-Json).compiler
          "AK_CI_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'Windows SDK SignTool not found' }
          "AK_CI_SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and exercise Windows GUI installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AK_WINDOWS_CODE_SIGN_PFX_BASE64: ${{ github.repository == 'dvino/ak-configurator' && github.event_name != 'pull_request' && secrets.AK_WINDOWS_CODE_SIGN_PFX_BASE64 || '' }}
          AK_WINDOWS_CODE_SIGN_PFX_PASSWORD: ${{ github.repository == 'dvino/ak-configurator' && github.event_name != 'pull_request' && secrets.AK_WINDOWS_CODE_SIGN_PFX_PASSWORD || '' }}
          AK_WINDOWS_CODE_SIGN_THUMBPRINT: ${{ vars.AK_WINDOWS_CODE_SIGN_THUMBPRINT }}
          AK_WINDOWS_CODE_SIGN_MODE: ${{ vars.AK_WINDOWS_CODE_SIGN_MODE }}
          TRUSTED_SIGNING: ${{ github.repository == 'dvino/ak-configurator' && github.event_name != 'pull_request' }}
        run: |
          $build = @('scripts/build_windows_ci_candidate.py', '--platform', '${{ matrix.platform }}', '--binary', '${{ matrix.binary }}', '--runtime-check', 'target/candidate/runtime-self-check.json', '--cava-helper', 'target/audio-helper/cava.exe', '--output-dir', 'target/candidate', '--iscc', $env:AK_CI_ISCC)
          if ($env:TRUSTED_SIGNING -eq 'true') {
            python scripts/windows_signing_ci.py --public-cert assets/windows/ak-configurator-development.cer -- python @build --signed --signtool $env:AK_CI_SIGNTOOL --timestamp-url http://timestamp.digicert.com
          } else {
            Write-Host 'Untrusted pull request: building an unsigned development installer.'
            python @build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install, execute, and uninstall candidate on native runner
        if: runner.os != 'Windows'
        shell: bash
        env:
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          archive="target/candidate/ak-configurator-${version}-${CANDIDATE_PLATFORM}"
          case "$CANDIDATE_PLATFORM" in linux-*) archive="$archive.tar.gz" ;; windows-*) archive="$archive.zip" ;; macos-*) archive="$archive.app.zip" ;; esac
          python scripts/test_ak820_installed_candidate.py --archive "$archive" --platform "$CANDIDATE_PLATFORM" --report "target/candidate/install-smoke-${CANDIDATE_PLATFORM}.json"

      - name: Upload development binary and checksum
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.checksum }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload candidate package and checksum
        uses: actions/upload-artifact@v7
        with:
          name: desktop-candidate-${{ matrix.platform }}
          path: |
            target/candidate/*.zip
            target/candidate/*.tar.gz
            target/candidate/*.sha256
            target/candidate/*-setup.exe
            target/candidate/*-setup.exe.build.json
            target/candidate/*-setup.exe.build.p7s
            target/candidate/setup-smoke-${{ matrix.platform }}.json
            target/candidate/install-smoke-${{ matrix.platform }}.json
            target/candidate/runtime-smoke-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 7

  verify_candidates:
    name: Verify all six desktop candidates
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          persist-credentials: false
      - name: Test package source line endings
        run: python3 scripts/test_package_line_endings.py
      - name: Test Windows runtime dependency parser
        run: python3 scripts/test_windows_runtime_dependencies.py
      - name: Test offline package contracts
        run: python3 scripts/test_ak820_release_workflow.py
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-candidate-*
          path: candidate-artifacts
          merge-multiple: true
      - name: Verify packages and provenance
        env:
          TRUSTED_SIGNING: ${{ github.repository == 'dvino/ak-configurator' && github.event_name != 'pull_request' }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          source_commit="$(git rev-parse HEAD)"
          signing=()
          if [[ "$TRUSTED_SIGNING" == 'true' ]]; then
            signing+=(--require-windows-signing)
          else
            echo 'Verifying unsigned development candidates from an untrusted event.'
          fi
          python3 scripts/verify_ak820_release_candidate.py \
            --directory candidate-artifacts \
            --version "$version" \
            --source-commit "$source_commit" \
            --manifest candidate-manifest.json \
            "${signing[@]}"
