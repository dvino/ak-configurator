name: Desktop development builds

on:
  workflow_call:
    inputs:
      candidate_ref:
        description: Git ref to build and package
        required: true
        type: string
  workflow_dispatch:
  push:
    branches: [desktop-dev]
  pull_request:
    branches: [desktop-dev]

permissions:
  contents: read

concurrency:
  group: desktop-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            artifact: development-binary-linux-x86_64
            binary: target/release/ak-configurator
            checksum: target/release/SHA256SUMS
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            artifact: development-binary-linux-arm64
            binary: target/release/ak-configurator
            checksum: target/release/SHA256SUMS
          - os: windows-latest
            platform: windows-x86_64
            artifact: development-binary-windows-x86_64
            binary: target/release/ak-configurator.exe
            checksum: target/release/SHA256SUMS
          - os: windows-11-vs2026-arm
            platform: windows-arm64
            artifact: development-binary-windows-arm64
            binary: target/release/ak-configurator.exe
            checksum: target/release/SHA256SUMS
          - os: macos-15
            platform: macos-arm64
            artifact: development-binary-macos-arm64
            binary: target/aarch64-apple-darwin/release/ak-configurator
            checksum: target/aarch64-apple-darwin/release/SHA256SUMS
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos-x86_64
            artifact: development-binary-macos-x86_64
            binary: target/x86_64-apple-darwin/release/ak-configurator
            checksum: target/x86_64-apple-darwin/release/SHA256SUMS
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Test audio dependency setup (offline)
        shell: bash
        run: python scripts/test_build_cava_helper.py

      - name: Install macOS Rust target
        if: startsWith(matrix.os, 'macos-')
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libpulse-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libgl1-mesa-dev \
            xvfb \
            dbus-x11 \
            zenity

      - name: Check out pinned Windows audio build tools
        if: startsWith(matrix.platform, 'windows-')
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: 64810c6bf2bdc91ebcd75f140aec77580113f219
          path: target/vcpkg
          persist-credentials: false

      - name: Bootstrap pinned Windows static audio dependencies
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/target/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE/target/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare pinned native Windows pkgconf
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          $pkgconf = python scripts/build_cava_helper.py --prepare-windows-pkgconf target/pkgconf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PKG_CONFIG=$pkgconf" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build bundled audio helper without capture
        shell: bash
        run: python scripts/build_cava_helper.py --output-dir target/audio-helper

      - name: Verify real helper using synthetic FIFO PCM
        if: startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'macos-')
        shell: bash
        run: python scripts/test_cava_helper.py --binary target/audio-helper/cava

      - name: Test all targets (Linux)
        if: startsWith(matrix.platform, 'linux-')
        run: cargo test --locked --all-targets -- --test-threads=1

      - name: Test AK820 filesystem and ownership (Windows and macOS)
        if: startsWith(matrix.platform, 'windows-') || startsWith(matrix.platform, 'macos-')
        run: cargo test --locked --bin ak-configurator ak820_backup_files -- --test-threads=1

      - name: Test AK820 device ownership (Windows and macOS)
        if: startsWith(matrix.platform, 'windows-') || startsWith(matrix.platform, 'macos-')
        run: cargo test --locked --bin ak-configurator 'hid_ownership::' -- --test-threads=1

      - name: Test macOS USB metadata validation
        if: startsWith(matrix.platform, 'macos-')
        run: cargo test --locked --bin ak-configurator macos_usb -- --test-threads=1

      - name: Build development binary (Linux and Windows)
        if: startsWith(matrix.platform, 'linux-') || startsWith(matrix.platform, 'windows-')
        run: cargo build --locked --release

      - name: Build development binary (macOS)
        if: matrix.platform == 'macos-arm64' || matrix.platform == 'macos-x86_64'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Test optional MCP contracts (x86_64 Linux and Windows only)
        if: matrix.platform == 'linux-x86_64' || matrix.platform == 'windows-x86_64'
        run: cargo test --locked --features mcp-mock --bin ak-configurator 'mcp::' -- --test-threads=1

      - name: Build optional MCP mock binary (x86_64 Linux and Windows only)
        if: matrix.platform == 'linux-x86_64' || matrix.platform == 'windows-x86_64'
        run: cargo build --locked --bin ak-configurator --features mcp-mock

      - name: Exercise MCP stdio with mock backend (x86_64 Linux and Windows only)
        if: matrix.platform == 'linux-x86_64' || matrix.platform == 'windows-x86_64'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary=target/debug/ak-configurator.exe; else binary=target/debug/ak-configurator; fi
          python scripts/test_mcp_stdio.py --binary "$binary"

      - name: Execute native GUI runtime smoke under Xvfb (Linux)
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          mkdir -p target/candidate
          dbus-run-session -- xvfb-run -a env AK820_RUNTIME_SMOKE_TRAY_FIXTURE=1 python scripts/test_ak820_runtime_smoke.py --binary "${{ matrix.binary }}" --report "target/candidate/runtime-smoke-${{ matrix.platform }}.json"

      - name: Execute native GUI runtime smoke (Windows)
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/candidate | Out-Null
          python scripts/test_ak820_runtime_smoke.py --binary "${{ matrix.binary }}" --report "target/candidate/runtime-smoke-${{ matrix.platform }}.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute native GUI runtime smoke (macOS)
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          mkdir -p target/candidate
          python scripts/test_ak820_runtime_smoke.py --binary "${{ matrix.binary }}" --report "target/candidate/runtime-smoke-${{ matrix.platform }}.json"

      - name: Write SHA-256 manifest (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          cd "$(dirname "$BINARY")"
          shasum -a 256 "$(basename "$BINARY")" > SHA256SUMS

      - name: Write SHA-256 manifest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          $hash = (Get-FileHash $env:BINARY -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $env:BINARY -Leaf)" | Set-Content -Encoding ascii (Join-Path (Split-Path $env:BINARY) 'SHA256SUMS')

      - name: Execute target runtime self-check (offline, no device access)
        shell: bash
        env:
          CANDIDATE_BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p target/candidate
          "$CANDIDATE_BINARY" --self-check --output target/candidate/runtime-self-check.json

      - name: Package unsigned desktop alpha candidate
        shell: bash
        env:
          CANDIDATE_BINARY: ${{ matrix.binary }}
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
        run: python scripts/package_ak820_candidate.py --binary "$CANDIDATE_BINARY" --platform "$CANDIDATE_PLATFORM" --output-dir target/candidate --runtime-check target/candidate/runtime-self-check.json --cava-helper "target/audio-helper/cava$([[ "$CANDIDATE_PLATFORM" == windows-* ]] && echo .exe || true)"

      - name: Install, execute, and uninstall candidate on native runner
        shell: bash
        env:
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          archive="target/candidate/ak-configurator-${version}-${CANDIDATE_PLATFORM}"
          case "$CANDIDATE_PLATFORM" in linux-*) archive="$archive.tar.gz" ;; windows-*) archive="$archive.zip" ;; macos-*) archive="$archive.app.zip" ;; esac
          python scripts/test_ak820_installed_candidate.py --archive "$archive" --platform "$CANDIDATE_PLATFORM" --report "target/candidate/install-smoke-${CANDIDATE_PLATFORM}.json"

      - name: Upload development binary and checksum
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.checksum }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload candidate package and checksum
        uses: actions/upload-artifact@v7
        with:
          name: desktop-candidate-${{ matrix.platform }}
          path: |
            target/candidate/*.zip
            target/candidate/*.tar.gz
            target/candidate/*.sha256
            target/candidate/install-smoke-${{ matrix.platform }}.json
            target/candidate/runtime-smoke-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 7
